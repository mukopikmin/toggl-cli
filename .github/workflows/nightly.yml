name: Nightly

on:
  workflow_run:
    workflows:
      - Test
    branches:
      - main
    types:
      - completed

permissions:
  contents: write
  attestations: write
  id-token: write
  artifact-metadata: write

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  nightly:
    name: Publish nightly
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check attestation source
        env:
          EVENT: ${{ github.event.workflow_run.event }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$EVENT" = push
          test "$HEAD_REPO" = "$GITHUB_REPOSITORY"
          test "$TESTED_SHA" = "$GITHUB_SHA"

      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build nightly archives
        run: make release VERSION=nightly

      - name: Attest nightly archives
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Include public verification bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/provenance.json

      - name: Create or update nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly \
              --title "Nightly" \
              --notes "Latest tested build from main ($HEAD_SHA)." \
              --prerelease \
              --latest=false
            gh release upload nightly \
              dist/*.tar.gz \
              dist/*.zip \
              dist/*.sha256 \
              dist/provenance.json \
              dist/checksums.txt \
              --clobber
          else
            gh release create nightly \
              dist/*.tar.gz \
              dist/*.zip \
              dist/*.sha256 \
              dist/provenance.json \
              dist/checksums.txt \
              --target "$HEAD_SHA" \
              --title "Nightly" \
              --notes "Latest tested build from main ($HEAD_SHA)." \
              --prerelease \
              --latest=false
          fi

      # For an existing release, publish all assets before changing the pointer
      # used by the updater. Release creation creates the tag itself, so the
      # initial publication is the only case where this cannot be ordered.
      - name: Move nightly tag
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git tag --force nightly "$HEAD_SHA"
          git push origin refs/tags/nightly --force

      - name: Remove obsolete nightly releases and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.prerelease and (.tag_name | test("^v?[0-9]+\\.[0-9]+\\.[0-9]+-nightly$"))) | .tag_name' |
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              gh release delete "$tag" --cleanup-tag --yes
            fi
          done

          gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags?per_page=100" \
            --jq '.[].ref | sub("^refs/tags/"; "") | select(test("^v?[0-9]+\\.[0-9]+\\.[0-9]+-nightly$"))' |
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              encoded_tag="${tag//\//%2F}"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$encoded_tag"
            fi
          done
