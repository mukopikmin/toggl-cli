name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version without a v prefix
        required: true
        type: string
      target_sha:
        description: Exact main commit to release
        required: true
        type: string

permissions: {}

concurrency:
  group: stable-release-prepare
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release target
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      previous-stable-tag: ${{ steps.release.outputs.previous-stable-tag }}

    steps:
      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]

      - name: Checkout target commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Verify target and successful tests
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          git fetch origin main --no-tags
          test "${TARGET_SHA}" = "$(git rev-parse origin/main)"
          test "$(gh run list --workflow Test --branch main --commit "${TARGET_SHA}" --limit 1 --json conclusion --jq '.[0].conclusion // ""')" = success
          ! git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1
          ! gh release view "v${VERSION}" >/dev/null 2>&1
          previous_stable_tag="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // "release-notes-baseline"')"
          git rev-parse --verify "refs/tags/${previous_stable_tag}^{commit}"
          echo "previous-stable-tag=${previous_stable_tag}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build and attest release artifacts
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Checkout target commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.8.0

      - name: Build and verify release artifacts
        run: |
          deno task dist --version "${{ inputs.version }}"
          (cd dist && sha256sum --check --strict checksums.txt)
          while read -r checksum name; do
            test "$(cat "dist/${name}.sha256")" = "${checksum}"
          done < dist/checksums.txt

      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  generate-notes:
    name: Generate release notes
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ inputs.target_sha }}
          PREVIOUS_STABLE_TAG: ${{ needs.validate.outputs.previous-stable-tag }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f "tag_name=v${VERSION}" \
            -f "target_commitish=${TARGET_SHA}" \
            -f "previous_tag_name=${PREVIOUS_STABLE_TAG}" \
            > generated-notes.json
          jq \
            --arg version "${VERSION}" \
            --arg tag "v${VERSION}" \
            --arg targetSha "${TARGET_SHA}" \
            --arg previousStableTag "${PREVIOUS_STABLE_TAG}" \
            '{version:$version,tag:$tag,targetSha:$targetSha,previousStableTag:$previousStableTag,title:(.name // $tag),body:(.body // "")}' \
            generated-notes.json > release-notes.json
          jq -er .body release-notes.json > release-notes.md
          test -s release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: |
            release-notes.json
            release-notes.md
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: Assemble immutable release candidate
    needs:
      - validate
      - build
      - generate-notes
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist
          path: candidate/dist

      - name: Download release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
          path: candidate

      - name: Generate immutable plan
        id: plan
        env:
          VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ inputs.target_sha }}
          PREVIOUS_STABLE_TAG: ${{ needs.validate.outputs.previous-stable-tag }}
        run: |
          test "$(jq -er .version candidate/release-notes.json)" = "${VERSION}"
          test "$(jq -er .tag candidate/release-notes.json)" = "v${VERSION}"
          test "$(jq -er .targetSha candidate/release-notes.json)" = "${TARGET_SHA}"
          test "$(jq -er .previousStableTag candidate/release-notes.json)" = "${PREVIOUS_STABLE_TAG}"
          test -s candidate/release-notes.md
          (cd candidate/dist && sha256sum --check --strict checksums.txt)
          jq -n \
            --arg version "${VERSION}" \
            --arg tag "v${VERSION}" \
            --arg targetSha "${TARGET_SHA}" \
            --arg previousStableTag "${PREVIOUS_STABLE_TAG}" \
            --arg title "$(jq -er .title candidate/release-notes.json)" \
            --arg notesSha256 "$(sha256sum candidate/release-notes.md | cut -d' ' -f1)" \
            --arg artifactName release-candidate \
            --argjson artifacts "$(cd candidate/dist && awk '{print $1, $2}' checksums.txt | jq -Rn '[inputs | split(" ") | {sha256: .[0], name: .[-1]}]')" \
            '{version:$version,tag:$tag,targetSha:$targetSha,previousStableTag:$previousStableTag,title:$title,notesSha256:$notesSha256,artifactName:$artifactName,artifacts:$artifacts}' \
            > candidate/release-plan.json
          plan_sha256="$(sha256sum candidate/release-plan.json | cut -d' ' -f1)"
          echo "plan-sha256=${plan_sha256}" >> "${GITHUB_OUTPUT}"
          echo "Release plan SHA-256: ${plan_sha256}" >> "${GITHUB_STEP_SUMMARY}"
          cat candidate/release-notes.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate
          path: |
            candidate/dist/
            candidate/release-plan.json
            candidate/release-notes.json
            candidate/release-notes.md
          if-no-files-found: error
          retention-days: 7
