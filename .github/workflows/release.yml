name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions: {}

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  build:
    name: Validate, build, and attest
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      target-sha: ${{ steps.release.outputs.target-sha }}
      tag-object: ${{ steps.release.outputs.tag-object }}
      previous-stable-tag: ${{ steps.release.outputs.previous-stable-tag }}

    steps:
      - name: Reject moved tags
        env:
          FORCED: ${{ github.event.forced }}
        run: test "${FORCED}" = false

      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Validate release target
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          go run ./scripts/release check --version "${RELEASE_TAG#v}" > release-check.json || { cat release-check.json; exit 1; }
          echo "version=$(jq -er .version release-check.json)" >> "${GITHUB_OUTPUT}"
          echo "target-sha=$(jq -er .headSha release-check.json)" >> "${GITHUB_OUTPUT}"
          echo "tag-object=$(jq -er .tagObject release-check.json)" >> "${GITHUB_OUTPUT}"
          echo "previous-stable-tag=$(jq -er .previousStableTag release-check.json)" >> "${GITHUB_OUTPUT}"

      - name: Build and verify release artifacts
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          make release VERSION="${VERSION}"
          (cd dist && sha256sum --check --strict checksums.txt)

      - name: Attest release archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Verify and publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      TARGET_SHA: ${{ needs.build.outputs.target-sha }}
      TAG_OBJECT: ${{ needs.build.outputs.tag-object }}
      PREVIOUS_STABLE_TAG: ${{ needs.build.outputs.previous-stable-tag }}
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.target-sha }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download this run's release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist

      - name: Verify artifact names, checksums, and provenance
        run: |
          expected="$(printf '%s\n' \
            "toggl-cli-v${VERSION}-darwin-arm64.tar.gz" \
            "toggl-cli-v${VERSION}-linux-x64.tar.gz" \
            "toggl-cli-v${VERSION}-windows-x64.zip" | sort)"
          actual="$(awk '{print $2}' dist/checksums.txt | sort)"
          test "${actual}" = "${expected}"
          (cd dist && sha256sum --check --strict checksums.txt)
          while read -r checksum name; do
            test "$(cat "dist/${name}.sha256")" = "${checksum}"
            gh attestation verify "dist/${name}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-digest "${TARGET_SHA}"
          done < dist/checksums.txt
          expected_files="$(
            printf '%s\n' "${expected}"
            printf '%s\n' "${expected}" | sed 's/$/.sha256/'
            echo checksums.txt
          )"
          actual_files="$(find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)"
          test "${actual_files}" = "$(printf '%s\n' "${expected_files}" | sort)"

      - name: Generate release notes
        run: |
          go run ./scripts/release notes --version "${VERSION}" --output release-notes.json
          test "$(jq -er .headSha release-notes.json)" = "${TARGET_SHA}"
          test "$(jq -er .previousStableTag release-notes.json)" = "${PREVIOUS_STABLE_TAG}"
          jq -er .body release-notes.json > release-notes.md
          test -s release-notes.md

      - name: Revalidate immediately before publication
        run: |
          go run ./scripts/release check --version "${VERSION}" > release-check.json || { cat release-check.json; exit 1; }
          test "$(jq -er .tag release-check.json)" = "${RELEASE_TAG}"
          test "$(jq -er .headSha release-check.json)" = "${TARGET_SHA}"
          test "$(jq -er .tagObject release-check.json)" = "${TAG_OBJECT}"
          test "$(jq -er .previousStableTag release-check.json)" = "${PREVIOUS_STABLE_TAG}"

      - name: Publish GitHub release
        run: |
          gh release create "${RELEASE_TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "$(jq -er .title release-notes.json)" \
            --notes-file release-notes.md \
            --verify-tag \
            --latest

      - name: Verify published release
        run: |
          gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json isDraft,isPrerelease,body,assets,url > published-release.json
          jq -e '.isDraft == false and .isPrerelease == false' published-release.json
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)" = "${RELEASE_TAG}"
          test "$(jq -r .body published-release.json)" = "$(jq -r .body release-notes.json)"
          expected="$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)"
          actual="$(jq -r '.assets[].name' published-release.json | sort)"
          test "${actual}" = "${expected}"
          test "$(git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" | cut -f1)" = "${TAG_OBJECT}"
          {
            echo "Release: $(jq -r .url published-release.json)"
            echo "Target SHA: ${TARGET_SHA}"
            echo "Notes range: ${PREVIOUS_STABLE_TAG}...${RELEASE_TAG}"
            cat dist/checksums.txt
            cat release-notes.md
          } >> "${GITHUB_STEP_SUMMARY}"
