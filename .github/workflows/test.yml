name: Test
on:
  workflow_dispatch:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  test:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check installer syntax
        run: sh -n install.sh
      - name: Check third-party notices
        run: |
          test -s THIRD_PARTY_NOTICES.md
          modules="$(go list -m -f '{{if not .Main}}{{.Path}}{{end}}' all)"
          for module in $modules; do
            grep -Fq "$module" THIRD_PARTY_NOTICES.md || {
              echo "Missing third-party notice for $module" >&2
              exit 1
            }
          done
      - name: Static analysis
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...
