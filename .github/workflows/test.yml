name: Test
on:
  workflow_dispatch:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  test:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: Check formatting
        run: make check-fmt
      - name: Check installer syntax
        run: make check-shell
      - name: Check third-party notices
        run: make check-notices
      - name: Static analysis
        run: make vet
      - name: Test
        run: make test
      - name: Build
        run: make check-build
