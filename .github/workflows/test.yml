name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Deno
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.8.0

      - name: Check formatting
        run: deno fmt --check

      - name: Check installer syntax
        run: sh -n install.sh

      - name: Type check
        run: deno check --lock=deno.lock main.ts main_test.ts toggl/project_adapter_test.ts command/update_test.ts model/project_test.ts scripts/install.ts scripts/install_release_test.ts scripts/install_test.ts scripts/release.ts scripts/release_test.ts toggl/date_range_test.ts toggl/time_entry_aggregation_test.ts

      - name: Test
        run: deno test --allow-read --allow-write --allow-run=sh,tar --allow-env=HOME,PATH main_test.ts toggl/project_adapter_test.ts command/update_test.ts model/project_test.ts scripts/install_release_test.ts scripts/install_test.ts scripts/release_test.ts toggl/date_range_test.ts toggl/time_entry_aggregation_test.ts

      - name: Compile
        run: deno compile --quiet --allow-net=api.github.com,github.com --allow-read --allow-write --allow-run --allow-env --output /tmp/toggl-cli main.ts
