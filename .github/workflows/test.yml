name: Test
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  test:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: make check-fmt
      - name: Check installer syntax
        run: make check-shell
      - name: Check third-party notices
        run: make check-notices
      - name: Static analysis
        run: make vet
      - name: Test
        run: make test
      - name: Build Linux release archive for E2E
        run: make release VERSION=0.0.0-e2e TARGET=linux-x64
      - name: Test CLI end to end
        run: |
          tar -xzf dist/toggl-cli-v0.0.0-e2e-linux-x64.tar.gz -C "$RUNNER_TEMP"
          TOGGL_E2E_BINARY="$RUNNER_TEMP/toggl-cli-v0.0.0-e2e-linux-x64/toggl" make test-e2e
      - name: Build
        run: make check-build
      - name: Check vulnerabilities
        run: make check-vuln
