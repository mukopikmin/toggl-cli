name: Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@f18c1e0c8b801e2bb1e5986465851e8a7f165732 # v6.0.0
        with:
          go-version: '1.23.x'
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check installer syntax
        run: sh -n install.sh
      - name: Static analysis
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build -o /tmp/toggl-cli ./cmd/toggl
